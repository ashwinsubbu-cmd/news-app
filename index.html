<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Daily News</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
.container{max-width:800px;margin:0 auto}
.header{background:#fff;border-radius:20px;padding:30px;margin-bottom:20px;box-shadow:0 10px 40px rgba(0,0,0,0.1)}
h1{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:2.5em;margin-bottom:10px}
.subtitle{color:#666;font-size:1.1em}
.tag{display:inline-block;background:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);color:#fff;padding:6px 14px;border-radius:15px;font-size:0.85em;font-weight:600;margin:10px 5px 0 0}
.tag:nth-child(2){background:linear-gradient(135deg,#fa709a 0%,#fee140 100%)}
.tag:nth-child(3){background:linear-gradient(135deg,#30cfd0 0%,#330867 100%)}
.controls{background:#fff;border-radius:20px;padding:20px;margin-bottom:20px;box-shadow:0 10px 40px rgba(0,0,0,0.1);display:flex;gap:10px;flex-wrap:wrap}
.btn{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;padding:12px 24px;border-radius:25px;cursor:pointer;font-size:1em;font-weight:600;transition:transform 0.2s}
.btn:hover{transform:translateY(-2px)}
.news-card{background:#fff;border-radius:15px;padding:25px;margin-bottom:20px;box-shadow:0 10px 40px rgba(0,0,0,0.1);cursor:pointer;transition:transform 0.3s}
.news-card:hover{transform:translateY(-5px)}
.news-category{font-size:0.75em;font-weight:700;text-transform:uppercase;color:#667eea;margin-bottom:10px}
.news-title{font-size:1.4em;font-weight:700;color:#333;margin-bottom:12px;line-height:1.4}
.news-description{color:#666;line-height:1.6;margin-bottom:15px}
.news-summary{background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%);border-left:3px solid #667eea;padding:15px;border-radius:10px;margin-top:15px;font-size:0.95em}
.summary-header{font-weight:700;color:#667eea;margin-bottom:8px;font-size:0.9em}
.news-meta{display:flex;justify-content:space-between;color:#999;font-size:0.9em;margin-top:15px;padding-top:15px;border-top:1px solid #eee}
.read-btn{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:0.85em;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>📰 My Daily News</h1>
<p class="subtitle">Your personalized tech & life news digest</p>
<div>
<span class="tag">🔥 Breaking News</span>
<span class="tag">🛂 Immigration & H1B</span>
<span class="tag">🤖 AI in Sales</span>
<span class="tag">💻 Tech & AI</span>
<span class="tag">💼 Consulting</span>
<span class="tag">🖥️ Microsoft</span>
</div>
</div>

<div class="controls">
<button class="btn" onclick="location.reload()">🔄 Refresh News</button>
</div>

<div id="news-container"></div>
</div>

<script>
const news = [
{category:'Breaking News',title:'Microsoft Acquires AI Startup for $10 Billion',description:'Microsoft announced a major AI infrastructure acquisition, marking one of the largest AI deals of 2025.',summary:'Microsoft is acquiring an AI infrastructure startup for $10 billion to strengthen its enterprise AI position. The deal includes GPU optimization technology and 500+ AI researchers. Expected to close Q3 2025 pending regulatory approval.',url:'https://techcrunch.com'},
{category:'Immigration & H1B',title:'USCIS Announces New H1B Lottery System Changes',description:'Major reforms to H1B visa lottery including beneficiary-centric selection.',summary:'USCIS implementing one-person-one-registration rule to prevent duplicate entries. Starting April 2026, system selects unique beneficiaries rather than petitions. Tech workers should work with single employers for best chances.',url:'https://uscis.gov'},
{category:'AI in Sales',title:'AI Sales Agents Generate $2M in Pipeline',description:'AI-powered SDRs booking 40% more meetings than human reps.',summary:'Mid-market SaaS company deployed AI agents that analyzed 50,000 prospects and booked 320 qualified meetings in 90 days. Response rates jumped from 2% to 6.8%. Invested $15K but saved $180K in SDR salaries.',url:'https://saastr.com'},
{category:'Tech & AI',title:'OpenAI Announces GPT-5 with Enhanced Reasoning',description:'Latest AI model promises breakthrough improvements in reasoning and problem solving.',summary:'GPT-5 demonstrates PhD-level reasoning on complex problems. Features improved memory, reduced hallucinations, and maintains context across 1 million tokens. Pricing expected at $50-100 per million tokens.',url:'https://openai.com'},
{category:'Microsoft & Software',title:'Microsoft Copilot Now Available Across All Office 365',description:'AI assistant expanding to all subscription tiers with new pricing.',summary:'Microsoft bundling Copilot into all Office 365 plans at no extra cost for basic features. Premium capabilities $20/user/month. Makes AI available to 400+ million Office users. Early adopters report 30% time savings.',url:'https://microsoft.com'},
{category:'India Economy',title:"India's Digital Economy to Reach $1 Trillion by 2026",description:'Explosive growth in digital payments, e-commerce, and tech startups.',summary:"India's digital economy projected to hit $1 trillion by 2026. UPI processing 12 billion transactions monthly. Digital payments grew 59% year-over-year. India has world's third-largest startup ecosystem with 800+ million internet users.",url:'https://economictimes.com'}
];

function render(){
const container = document.getElementById('news-container');
container.innerHTML = news.map((n,i) => `
<div class="news-card" onclick="window.open('${n.url}','_blank')">
<div class="news-category">${n.category}</div>
<h3 class="news-title">${n.title}</h3>
<p class="news-description">${n.description}</p>
<div class="news-summary">
<div class="summary-header">⚡ 30-Second Summary</div>
<div>${n.summary}</div>
<button class="read-btn" onclick="event.stopPropagation();speak(${i})">🔊 Read Aloud</button>
</div>
<div class="news-meta">
<span>📰 Source</span>
<span>🕒 2 hours ago</span>
</div>
</div>
`).join('');
}

function speak(i){
const text = news[i].title + '. ' + news[i].summary;
const speech = new SpeechSynthesisUtterance(text);
speechSynthesis.speak(speech);
}

render();
</script>
</body>
</html>
