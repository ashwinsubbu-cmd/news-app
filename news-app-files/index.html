<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Daily News</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
.container{max-width:800px;margin:0 auto}
.header{background:#fff;border-radius:20px;padding:30px;margin-bottom:20px;box-shadow:0 10px 40px rgba(0,0,0,0.1)}
h1{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:2.5em;margin-bottom:10px}
.subtitle{color:#666;font-size:1.1em}
.tag{display:inline-block;background:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);color:#fff;padding:6px 14px;border-radius:15px;font-size:0.85em;font-weight:600;margin:10px 5px 0 0}
.tag:nth-child(2){background:linear-gradient(135deg,#fa709a 0%,#fee140 100%)}
.tag:nth-child(3){background:linear-gradient(135deg,#30cfd0 0%,#330867 100%)}
.tag:nth-child(4){background:linear-gradient(135deg,#a8edea 0%,#fed6e3 100%);color:#333}
.controls{background:#fff;border-radius:20px;padding:20px;margin-bottom:20px;box-shadow:0 10px 40px rgba(0,0,0,0.1);display:flex;gap:10px;flex-wrap:wrap}
.btn{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;padding:12px 24px;border-radius:25px;cursor:pointer;font-size:1em;font-weight:600;transition:transform 0.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(102,126,234,0.4)}
.news-card{background:#fff;border-radius:15px;padding:25px;margin-bottom:20px;box-shadow:0 10px 40px rgba(0,0,0,0.1);cursor:pointer;transition:transform 0.3s;position:relative;overflow:hidden}
.news-card::before{content:'';position:absolute;top:0;left:0;width:5px;height:100%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
.news-card:hover{transform:translateY(-5px);box-shadow:0 15px 50px rgba(0,0,0,0.15)}
.news-category{font-size:0.75em;font-weight:700;text-transform:uppercase;color:#667eea;margin-bottom:10px}
.news-title{font-size:1.4em;font-weight:700;color:#333;margin-bottom:12px;line-height:1.4}
.news-description{color:#666;line-height:1.6;margin-bottom:15px}
.news-summary{background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%);border-left:3px solid #667eea;padding:15px;border-radius:10px;margin-top:15px;font-size:0.95em}
.summary-header{font-weight:700;color:#667eea;margin-bottom:8px}
.news-meta{display:flex;justify-content:space-between;color:#999;font-size:0.9em;margin-top:15px;padding-top:15px;border-top:1px solid #eee}
.read-btn{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:0.85em;margin-top:10px}
.read-btn.playing{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%)}
.loading{text-align:center;padding:60px;background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.1)}
.spinner{width:50px;height:50px;border:5px solid #f3f3f3;border-top:5px solid #667eea;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>📰 My Daily News</h1>
<p class="subtitle">Your personalized tech & life news digest - Live Feed</p>
<div>
<span class="tag">🔥 Breaking News</span>
<span class="tag">🛂 Immigration & H1B</span>
<span class="tag">🤖 AI in Sales</span>
<span class="tag">💻 Tech & AI</span>
</div>
</div>

<div class="controls">
<button class="btn" onclick="fetchLiveNews()">🔄 Refresh Live News</button>
</div>

<div id="news-container">
<div class="loading">
<div class="spinner"></div>
<p>Loading latest news...</p>
</div>
</div>
</div>

<script>
let currentSpeech=null;
let currentIndex=-1;

// Fetch news from our secure backend API
async function fetchLiveNews(){
const container=document.getElementById('news-container');
container.innerHTML='<div class="loading"><div class="spinner"></div><p>Fetching latest news...</p></div>';
    
try{
// Call our serverless function (API key is hidden on backend)
const response=await fetch('/api/news');
const data=await response.json();
        
if(data.articles&&data.articles.length>0){
renderNews(data.articles);
}else{
container.innerHTML='<div class="loading"><p>No news available. Try again later.</p></div>';
}
}catch(error){
console.error('Error:',error);
container.innerHTML='<div class="loading"><p>❌ Error loading news. Please try again.</p></div>';
}
}

function renderNews(articles){
const container=document.getElementById('news-container');
container.innerHTML=articles.map((article,i)=>`
<div class="news-card" onclick="window.open('${article.url}','_blank')">
<div class="news-category">${article.category||'News'}</div>
<h3 class="news-title">${article.title}</h3>
<p class="news-description">${article.description||article.content?.substring(0,200)+'...'||''}</p>
${article.summary?`
<div class="news-summary">
<div class="summary-header">⚡ AI Summary</div>
<div>${article.summary}</div>
<button class="read-btn" id="btn-${i}" onclick="event.stopPropagation();toggleSpeak(${i})">
<span id="icon-${i}">🔊</span> <span id="label-${i}">Read Aloud</span>
</button>
</div>
`:''}
<div class="news-meta">
<span>📰 ${article.source?.name||'Source'}</span>
<span>🕒 ${getTimeAgo(article.publishedAt)}</span>
</div>
</div>
`).join('');
    
// Store articles for speech
window.newsArticles=articles;
}

function toggleSpeak(i){
if(currentSpeech){
window.speechSynthesis.cancel();
if(currentIndex>=0){
const prevBtn=document.getElementById(`btn-${currentIndex}`);
const prevIcon=document.getElementById(`icon-${currentIndex}`);
const prevLabel=document.getElementById(`label-${currentIndex}`);
if(prevBtn)prevBtn.classList.remove('playing');
if(prevIcon)prevIcon.textContent='🔊';
if(prevLabel)prevLabel.textContent='Read Aloud';
}
currentSpeech=null;
if(i===currentIndex){currentIndex=-1;return;}
}

const article=window.newsArticles[i];
const text=(article.title||'')+'. '+(article.summary||article.description||'');
const speech=new SpeechSynthesisUtterance(text);
speech.rate=1.0;

const btn=document.getElementById(`btn-${i}`);
const icon=document.getElementById(`icon-${i}`);
const label=document.getElementById(`label-${i}`);
btn.classList.add('playing');
icon.textContent='⏸️';
label.textContent='Stop';

speech.onend=()=>{
btn.classList.remove('playing');
icon.textContent='🔊';
label.textContent='Read Aloud';
currentSpeech=null;
currentIndex=-1;
};

window.speechSynthesis.speak(speech);
currentSpeech=speech;
currentIndex=i;
}

function getTimeAgo(dateString){
if(!dateString)return 'Recently';
const now=new Date();
const published=new Date(dateString);
const diffMs=now-published;
const diffHours=Math.floor(diffMs/(1000*60*60));
    
if(diffHours<1)return 'Just now';
if(diffHours===1)return '1 hour ago';
if(diffHours<24)return `${diffHours} hours ago`;
const diffDays=Math.floor(diffHours/24);
if(diffDays===1)return '1 day ago';
return `${diffDays} days ago`;
}

// Load news on page load
fetchLiveNews();
</script>
</body>
</html>
